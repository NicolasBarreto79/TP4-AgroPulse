name: agropulse

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.18
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "19644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_DIRECTORY: worker
        SERVICE_WORKSPACE: "@agropulse/worker"
    environment:
      REDPANDA_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
      SUPABASE_URL: ${SUPABASE_URL:-https://your-project.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-replace-with-local-service-role-key}
      FORCE_COMMAND_FAILURE: ${FORCE_COMMAND_FAILURE:-false}
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  simulator:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_DIRECTORY: simulator
        SERVICE_WORKSPACE: "@agropulse/simulator"
    environment:
      REDPANDA_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  command-publisher:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_DIRECTORY: command-publisher
        SERVICE_WORKSPACE: "@agropulse/command-publisher"
    environment:
      REDPANDA_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
      SUPABASE_URL: ${SUPABASE_URL:-https://your-project.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-replace-with-local-service-role-key}
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redpanda-data:
